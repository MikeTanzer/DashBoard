name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these to publish; the token is scoped per-run.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # BASE_PATH is the repo name: Pages serves a project site under /<repo>/,
      # so every asset URL has to be prefixed or the page loads without CSS.
      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which drops any
      # directory starting with an underscore — including Next's _next/.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
